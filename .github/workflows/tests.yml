name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secdl
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: security_lake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secdl -d security_lake"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: secdl
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_DB: security_lake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # -rs: atlanan test olursa sebebiyle birlikte gösterir (veritabanı testleri burada atlanmamalı).
      - run: python -m pytest -q -rs
